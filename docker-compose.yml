version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: adsis_postgres_core
    environment:
      POSTGRES_USER: adsis_admin
      POSTGRES_PASSWORD: secure_adsis_password
      POSTGRES_DB: adsis_central_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: adsis_unified_core
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://adsis_admin:secure_adsis_password@db:5432/adsis_central_db
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 & streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  pgdata: